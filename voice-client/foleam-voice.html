<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self' wss://mailan1.ru; media-src 'self' blob:; object-src 'none'; base-uri 'none'; frame-src 'none'"><title>Foleam Voice</title><link rel="stylesheet" href="foleam-voice.css"></head>
<body><header><img src="/foleam-logo.png" alt="" width="40" height="40"><div><h1>Foleam Voice</h1><span id="identity">Подключение к Mailan1</span></div><span id="connection" role="status">Не подключено</span></header>
<main><section id="entry"><h2>Голосовое лобби</h2><button id="create" disabled>Создать лобби</button><form id="join-form"><label for="code">Код или ссылка приглашения</label><div class="join-row"><input id="code" maxlength="200" autocomplete="off" placeholder="Код лобби"><button id="join" disabled>Присоединиться</button></div></form><a id="login" href="/login?loginMode=id" hidden>Войти в Mailan1</a></section>
<section id="room" hidden><div class="room-heading"><div><span>Лобби</span><h2 id="room-code"></h2></div><button id="copy">Копировать ссылку</button></div><ul id="members"></ul><div class="controls"><button id="mic" title="Выключить микрофон" aria-label="Выключить микрофон"></button><label for="volume">Громкость</label><input id="volume" type="range" min="0" max="100" value="100"><output id="volume-value">100%</output><button id="leave" class="danger">Выйти</button></div><button id="close" class="secondary" hidden>Закрыть лобби для всех</button></section><p id="message" role="status" aria-live="polite"></p></main><script src="/socket.io/socket.io.js"></script><script src="foleam-voice-icons.js"></script><script src="foleam-voice.js"></script></body></html>
